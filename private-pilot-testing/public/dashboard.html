<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dashboard · Basic Registration Demo</title><link rel="stylesheet" href="styles.css"></head><body class="dashboard-page"><header class="topbar"><a class="brand" href="/">Basic Registration <span>Demo</span></a><div class="session-state"><span class="status-dot" aria-hidden="true"></span><button id="logoutButton" class="text-button" type="button">Log out</button></div></header><main class="dashboard-shell"><section class="dashboard-heading"><div><p class="kicker">Authenticated workspace</p><h1>Your profile</h1><p>Your information is loaded dynamically from the protected profile service after authentication.</p></div></section><section id="loadingState" class="profile-card loading-card"><div class="skeleton"></div><div class="skeleton short"></div><p>Loading your profile…</p></section><section id="profileView" hidden><div class="profile-grid"><article class="profile-card identity-card"><div class="avatar" id="avatar">P</div><dl class="profile-details"><div><dt>Full name</dt><dd id="profileName"></dd></div><div><dt>Age</dt><dd id="profileAge"></dd></div></dl></article><article class="profile-card account-card"><span class="label">Bank account number</span><div id="profileAccount" class="account-number"></div></article></div><form id="hireForm" class="profile-card response-card" novalidate><header><span class="label">Application questions</span><h2>Your responses</h2></header><div class="question-list"><div class="question-field"><label for="hireReason">1. Why should we hire you?</label><textarea id="hireReason" maxlength="500" rows="5"></textarea><small><span data-count-for="hireReason">0</span>/500</small></div><div class="question-field"><label for="strongestSkills">2. What are your strongest skills?</label><textarea id="strongestSkills" maxlength="500" rows="5"></textarea><small><span data-count-for="strongestSkills">0</span>/500</small></div><div class="question-field"><label for="challengeSolved">3. Describe a challenging problem you solved.</label><textarea id="challengeSolved" maxlength="500" rows="5"></textarea><small><span data-count-for="challengeSolved">0</span>/500</small></div></div><div class="form-footer"><p id="saveMessage" class="form-message" role="status"></p><button class="primary" type="submit">Save answers</button></div></form></section></main><script src="app.js" defer></script></body></html>
