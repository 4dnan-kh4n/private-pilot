<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PrivatePilot</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <img class="brand-logo" src="privatepilot-logo.png" alt="" width="48" height="48">
        <div>
          <p class="eyebrow">Privacy in your browser</p>
          <h1>PrivatePilot</h1>
        </div>
      </header>
      <section class="status-card" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <p class="status-label">Status</p>
          <h2 id="status">Checking this page</h2>
          <p id="siteMessage">Open a webpage and click the PrivatePilot toolbar button.</p>
        </div>
      </section>
      <button id="analyseButton" type="button" disabled>Review local analysis</button>
      <section id="captureView" class="capture-card" hidden>
        <div class="capture-header">
          <h2>Detected private details</h2>
        </div>
        <p class="review-help">Unmark a detail to show it on the page again.</p>
        <dl id="fieldsList" class="fields-list"></dl>
        <p id="emptyMessage" hidden>No supported private details were detected on this page.</p>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
